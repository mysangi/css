<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CSS Portal — Results & Subject Builder</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 14 L52 22 L32 30 L12 22 Z' fill='%23ffffff'/%3E%3Cpath d='M20 26 L20 38 C20 42 26 46 32 46 C38 46 44 42 44 38 L44 26' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* THEME VARIABLES */
    :root, [data-theme="light"] {
      --bg: #f4f7fc; --panel: #ffffff; --panel-2: #f1f5f9; --accent: #2563eb; --accent-hover: #1a4fc7;
      --ok: #16a34a; --danger: #dc2626; --warn: #d97706; --text: #1e2b3c; --text-dark: #0a1e2e;
      --muted: #64748b; --border: #e2e9f3; --shadow: rgba(0, 20, 40, 0.06); --hover: #f8fafc;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #273449; --accent: #38bdf8; --accent-hover: #0284c7;
      --ok: #22c55e; --danger: #ef4444; --warn: #f59e0b; --text: #e2e8f0; --text-dark: #f8fafc;
      --muted: #94a3b8; --border: #334155; --shadow: rgba(0, 0, 0, 0.3); --hover: #2e3d56;
    }

    /* RESET & GLOBAL */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s;
    }

    /* SHARED HEADER */
    .app-header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 12px var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: var(--text-dark); }
    .brand i { color: var(--accent); font-size: 1.5rem; }
    .brand .version { font-size: 0.65rem; color: var(--muted); background: var(--panel-2); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); margin-left: 4px; }
    
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
    .nav-tab {
      padding: 0.5rem 1.2rem; border-radius: 40px; font-size: 0.85rem; font-weight: 600; color: var(--muted);
      cursor: pointer; border: none; background: transparent; display: flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .nav-tab.active { background: var(--panel); color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }
    
    .theme-btn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: 0.2s;
    }
    .theme-btn:hover { background: var(--hover); }

    /* VIEWS */
    .view-section { display: none; flex: 1; padding: 1.5rem; max-width: 1440px; margin: 0 auto; width: 100%; }
    .view-section.active { display: block; }

    /* 1. RESULTS DASHBOARD */
    .dash-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .dash-header h1 { font-weight: 600; font-size: 1.5rem; color: var(--text-dark); display: flex; align-items: center; gap: 10px; }
    .badge-count { background: var(--panel-2); color: var(--text); padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); }
    .load-status { background: var(--panel); padding: 0.5rem 1rem; border-radius: 40px; font-size: 0.85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
    .load-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
    .load-status.done .dot { background: var(--ok); animation: none; }
    .load-status.error .dot { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; background: var(--panel); padding: 1rem 1.5rem; border-radius: 20px; box-shadow: 0 8px 20px var(--shadow); align-items: center; border: 1px solid var(--border); }
    .search-group { display: flex; flex-wrap: wrap; gap: 0.8rem; flex: 2; min-width: 260px; }
    .search-wrapper { flex: 1; min-width: 180px; position: relative; }
    .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-wrapper input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 60px; background: var(--bg); color: var(--text); outline: none; transition: 0.2s; }
    .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
    
    .filter-group { display: flex; flex-wrap: wrap; gap: 1rem; flex: 3; justify-content: flex-end; }
    .select-wrapper { position: relative; min-width: 140px; }
    .select-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 0.9rem; }
    .select-wrapper select { width: 100%; padding: 0.8rem 2rem 0.8rem 2.5rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; appearance: none; background: var(--bg); border: 1px solid var(--border); border-radius: 60px; cursor: pointer; outline: none; color: var(--text); font-weight: 500; }
    .select-wrapper::after { content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    
    .clear-btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 60px; padding: 0.8rem 1.5rem; font-weight: 500; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .clear-btn:hover { background: var(--hover); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    .student-card { background: var(--panel); border-radius: 20px; padding: 1.5rem; box-shadow: 0 12px 30px var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.9rem; transition: 0.2s; }
    .student-card:hover { transform: translateY(-4px); box-shadow: 0 20px 35px var(--shadow); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .sr-badge { background: var(--panel-2); color: var(--accent); font-weight: 600; font-size: 0.8rem; padding: 0.3rem 0.9rem; border-radius: 40px; display: flex; align-items: center; gap: 5px; }
    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 1rem; border-radius: 40px; text-transform: uppercase; background: var(--panel-2); color: var(--muted); }
    .status-badge.status-fail { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
    .status-badge.status-pass { background: rgba(22, 163, 74, 0.1); color: var(--ok); }
    
    .student-name { font-weight: 700; font-size: 1.2rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
    .student-name i { color: var(--accent); opacity: 0.8; }
    .info-row { display: flex; flex-wrap: wrap; gap: 1rem; background: var(--bg); padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .info-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .info-item i { color: var(--muted); }
    .info-item strong { color: var(--text-dark); margin-right: 4px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 0.8rem; }
    .updated { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .pdf-link { background: var(--accent); color: #fff; text-decoration: none; padding: 0.4rem 1rem; border-radius: 60px; font-weight: 500; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 7px; }
    .pdf-link:hover { background: var(--accent-hover); }
    .pdf-link.disabled { background: var(--panel-2); color: var(--muted); pointer-events: none; }

    .no-results, .loading-spinner, .error-message { grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--panel); border-radius: 20px; border: 1px dashed var(--border); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .load-more-wrap { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 2rem 1rem; }
    .load-more-btn { background: var(--accent); color: white; border: none; border-radius: 60px; padding: 0.9rem 2.2rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(37,99,235,0.25); }
    .load-more-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

    /* 2. SUBJECT BUILDER */
    .builder-container { background: var(--bg); border-radius: 20px; display: flex; flex-direction: column; height: calc(100vh - 130px); min-height: 600px; border: 1px solid var(--border); box-shadow: 0 8px 20px var(--shadow); }
    .b-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); border-radius: 20px 20px 0 0; }
    .b-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .b-title-left h2 { font-size: 1.1rem; color: var(--text-dark); }
    
    .b-toggle-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); cursor: pointer; background: var(--panel-2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
    .b-toggle-label input { display: none; }
    .b-toggle-switch { width: 28px; height: 16px; background: var(--border); border-radius: 999px; position: relative; transition: 0.2s; }
    .b-toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .b-toggle-label input:checked + .b-toggle-switch { background: var(--ok); }
    .b-toggle-label input:checked + .b-toggle-switch::after { transform: translateX(12px); }

    .b-strip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; max-height: 18vh; overflow-y: auto; cursor: pointer; position: relative; transition: 0.2s; }
    .b-strip.valid { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2); }
    .b-strip-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .b-strip-head .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 600; }
    .b-total-pill { font-size: 0.85rem; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border); }
    .b-total-pill.ok { color: var(--ok); border-color: var(--ok); }
    .b-total-pill.over { color: var(--danger); border-color: var(--danger); }
    
    .b-chosen-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .b-chosen-list li { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; background: var(--panel); border-left: 3px solid transparent; font-size: 0.85rem; border: 1px solid var(--border); }
    .b-chosen-list li.violating { border-color: var(--danger); background: rgba(220, 38, 38, 0.05); }
    .b-chosen-list li.g1 { border-left-color: #3b82f6; } .b-chosen-list li.g2 { border-left-color: #22c55e; }
    .b-chosen-list li.g3 { border-left-color: #a855f7; } .b-chosen-list li.g4 { border-left-color: #f59e0b; }
    .b-chosen-list li.g5 { border-left-color: #ec4899; } .b-chosen-list li.g6 { border-left-color: #06b6d4; }
    .b-chosen-list li.g7 { border-left-color: #f97316; } .b-chosen-list li.comp { border-left-color: var(--muted); }
    .b-chosen-list .rm { color: var(--danger); background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
    
    .b-status { font-size: 0.8rem; margin-top: 6px; font-weight: 500; }
    .b-status.ok { color: var(--ok); } .b-status.err { color: var(--danger); } .b-status.warn { color: var(--warn); }

    .b-toolbar { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .b-toolbar button { flex: 1; padding: 6px; border-radius: 6px; cursor: pointer; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-size: 0.8rem; font-weight: 500; }
    .b-toolbar button:hover { background: var(--hover); }

    .b-groups-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .b-group { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .b-group-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; cursor: pointer; background: var(--panel-2); font-size: 0.9rem; font-weight: 600; }
    .b-group-header small { color: var(--muted); font-weight: 400; font-size: 0.75rem; margin-left: 4px; }
    .b-group-body { display: none; padding: 8px; }
    .b-group.open .b-group-body { display: block; }
    .b-group.violation { border-color: var(--danger); }
    
    .b-subject { position: relative; display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; font-size: 0.9rem; }
    .b-subject:hover { background: var(--hover); }
    .b-subject.selected { background: rgba(37, 99, 235, 0.08); border-color: var(--accent); }
    .b-subject.compulsory { cursor: default; }
    .b-subject.compulsory.selected { background: var(--panel-2); border-color: var(--border); }
    .b-subject .marks { font-size: 0.75rem; color: var(--muted); }
    
    .b-rec-badge { display: none; position: absolute; top: 100%; left: 6px; right: 6px; margin-top: 4px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 6px; font-size: 0.8rem; z-index: 10; box-shadow: 0 4px 12px var(--shadow); pointer-events: none; }
    .b-subject:hover .b-rec-badge { display: block; }

    /* FULL SCREEN OVERLAY */
    .final-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
    .final-overlay.active { opacity: 1; pointer-events: auto; }
    .final-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .final-close { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 6px 16px; border-radius: 20px; cursor: pointer; }
    .final-summary { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; box-shadow: 0 4px 12px var(--shadow); }
    .sum-block { display: flex; flex-direction: column; }
    .sum-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .sum-val { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
    .final-list { flex: 1; overflow-y: auto; margin-bottom: 16px; }
    .final-actions { display: flex; gap: 10px; }
    .final-actions button { flex: 1; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
    .final-actions .confirm { background: var(--ok); color: #fff; border-color: var(--ok); }
    .final-actions .confirm:disabled { opacity: 0.5; cursor: not-allowed; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .app-header { flex-direction: column; gap: 1rem; padding: 1rem; }
      .header-actions { width: 100%; justify-content: space-between; }
      .toolbar { flex-direction: column; }
      .search-group, .filter-group { width: 100%; }
      .card-grid { grid-template-columns: 1fr; }
      .view-section { padding: 1rem; }
      .builder-container { height: calc(100vh - 180px); }
    }
  </style>
</head>
<body>

  <!-- SHARED HEADER -->
  <header class="app-header">
    <div class="brand">
      <i class="fas fa-graduation-cap"></i> CSS Portal
      <span class="version">v4.3</span>
    </div>
    <div class="header-actions">
      <div class="nav-tabs">
        <button class="nav-tab active" data-target="view-results"><i class="fas fa-list-check"></i> Results</button>
        <button class="nav-tab" data-target="view-builder"><i class="fas fa-book-open"></i> Builder</button>
      </div>
      <button class="theme-btn" id="themeBtn" title="Toggle Theme">🌙</button>
    </div>
  </header>

  <!-- VIEW 1: RESULTS DASHBOARD -->
  <section class="view-section active" id="view-results">
    <div class="dash-header">
      <h1><i class="fas fa-user-graduate"></i> MPT Results</h1>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <div class="load-status" id="loadStatus"><span class="dot"></span><span id="loadStatusText">Loading...</span></div>
        <div class="badge-count"><i class="fas fa-layer-group"></i> <span id="shownCount">0</span> / <span id="totalCount">0</span></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-group">
        <div class="search-wrapper"><i class="fas fa-user"></i><input type="text" id="nameSearch" placeholder="Search name..."></div>
        <div class="search-wrapper"><i class="fas fa-id-card"></i><input type="text" id="rollSearch" placeholder="Search roll no..."></div>
      </div>
      <div class="filter-group">
        <div class="select-wrapper"><i class="fas fa-calendar-alt"></i><select id="yearFilter"><option value="all">All years</option></select></div>
        <div class="select-wrapper"><i class="fas fa-circle-check"></i><select id="statusFilter"><option value="all">All status</option></select></div>
        <button class="clear-btn" id="clearFiltersBtn"><i class="fas fa-rotate-left"></i> Clear</button>
      </div>
    </div>

    <div class="card-grid" id="cardGrid">
      <div class="loading-spinner"><div class="spinner"></div><div>Loading students...</div></div>
    </div>
  </section>

  <!-- VIEW 2: SUBJECT BUILDER -->
  <section class="view-section" id="view-builder">
    <div class="builder-container">
      <div class="b-header">
        <div class="b-title-row">
          <div class="b-title-left"><h2>Optional Subject Builder</h2></div>
          <label class="b-toggle-label">
            <input type="checkbox" id="toggleCompulsory">
            <span class="b-toggle-switch"></span> Compulsory
          </label>
        </div>
        <div class="b-strip" id="selectedStrip">
          <div class="b-strip-head">
            <span class="lbl" id="stripLabel">Optional · Target 600</span>
            <span class="b-total-pill" id="totalPill">0 / 600</span>
          </div>
          <ul class="b-chosen-list" id="chosenList"><li class="empty">Loading subjects...</li></ul>
          <div class="b-status" id="status">Select subjects to begin.</div>
        </div>
      </div>

      <div class="b-toolbar">
        <button id="expandAllBtn">Expand All</button>
        <button id="collapseAllBtn">Collapse All</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div class="b-groups-container" id="bGroups"></div>
    </div>
  </section>

  <!-- FULL SCREEN OVERLAY -->
  <div class="final-overlay" id="finalOverlay">
    <div class="final-header">
      <h2>Final Choice Review</h2>
      <button class="final-close" id="finalCloseBtn">✕ Close</button>
    </div>
    <div class="final-summary">
      <div class="sum-block"><span class="sum-label">Total Marks</span><span class="sum-val" id="finalTotal">0 / 1200</span></div>
      <div class="sum-block" style="text-align:right;"><span class="sum-label">Subjects</span><span class="sum-val" id="finalCount">0</span></div>
    </div>
    <ul class="b-chosen-list final-list" id="finalList"></ul>
    <div id="finalStatus" class="b-status" style="text-align:center; margin-bottom:12px;"></div>
    <div class="final-actions">
      <button id="copyBtn"><i class="fas fa-copy"></i> Copy List</button>
      <button class="confirm" id="finalConfirmBtn" disabled>✓ Confirm 1200</button>
    </div>
  </div>

  <!-- ============================================================
       JAVASCRIPT: THEME & TABS
       ============================================================ -->
  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    
    const savedTheme = localStorage.getItem('css-theme') || 'light';
    root.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);
      themeBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('css-theme', newTheme);
    });

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });
  </script>

  <!-- ============================================================
       JAVASCRIPT: RESULTS DASHBOARD (CSV)
       ============================================================ -->
  <script>
    const CSV_FILE = 'css mpt results - all.csv';
    const CSV_URL  = encodeURI(CSV_FILE);
    const PAGE_SIZE = 1000;
    let ALL_STUDENTS = [], filtered = [], currentOffset = 0, nameSearch = '', rollSearch = '', currentYear = 'all', currentStatus = 'all', totalMatching = 0, loadedCount = 0, hasMore = true, dataReady = false;

    const nameInput = document.getElementById('nameSearch');
    const rollInput = document.getElementById('rollSearch');
    const yearFilter = document.getElementById('yearFilter');
    const statusFilter = document.getElementById('statusFilter');
    const cardGrid = document.getElementById('cardGrid');
    const shownCount = document.getElementById('shownCount');
    const totalCount = document.getElementById('totalCount');
    const loadStatusText = document.getElementById('loadStatusText');
    const loadStatus = document.getElementById('loadStatus');

    window.addEventListener('load', () => { loadCSV(); });

    async function loadCSV() {
      loadStatusText.textContent = 'Downloading...';
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        loadStatusText.textContent = 'Parsing...';
        ALL_STUDENTS = parseCSV(text);
        loadStatus.classList.add('done');
        loadStatusText.textContent = 'Ready · ' + ALL_STUDENTS.length.toLocaleString();
        dataReady = true;
        loadFilterMeta();
        applyFilters();
      } catch (err) {
        loadStatus.classList.add('error');
        loadStatusText.textContent = 'Failed';
        cardGrid.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Failed to load CSV.</div>';
      }
    }

    function parseCSV(text) {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const rows = []; let row = [], field = '', inQuotes = false, i = 0;
      while (i < text.length) {
        const ch = text[i], next = text[i + 1] || '';
        if (inQuotes) {
          if (ch === '"') { if (next === '"') { field += '"'; i += 2; continue; } inQuotes = false; i++; continue; }
          field += ch; i++; continue;
        }
        if (ch === '"') { inQuotes = true; i++; continue; }
        if (ch === ',') { row.push(field); field = ''; i++; continue; }
        if (ch === '\r') { i++; continue; }
        if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
        field += ch; i++;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      if (rows.length < 2) return [];
      const header = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));
      const col = {}; header.forEach((h, idx) => col[h] = idx);
      const get = (arr, ...keys) => { for (const k of keys) if (col[k] !== undefined) return arr[col[k]] || ''; return ''; };
      const out = [];
      for (let r = 1; r < rows.length; r++) {
        const rowArr = rows[r];
        if (!rowArr || rowArr.every(c => String(c).trim() === '')) continue;
        out.push({
          sr_no: get(rowArr, 'sr_no', 'srno', 'sr') || r,
          name: String(get(rowArr, 'name')).trim(),
          roll_no: String(get(rowArr, 'roll_no', 'rollno', 'roll')).trim(),
          status: String(get(rowArr, 'status')).trim(),
          url_results_pdf: String(get(rowArr, 'url_results_pdf', 'url')).trim(),
          year: String(get(rowArr, 'year')).trim(),
          updated_on: String(get(rowArr, 'updated_on', 'updated')).trim() || '—'
        });
      }
      return out;
    }

    function loadFilterMeta() {
      const years = new Set(), statuses = new Set();
      ALL_STUDENTS.forEach(s => { if(s.year) years.add(s.year); if(s.status) statuses.add(s.status); });
      const sortedYears = Array.from(years).sort();
      
      yearFilter.innerHTML = '<option value="all">All years</option>';
      sortedYears.forEach(y => yearFilter.innerHTML += `<option value="${y}">${y}</option>`);
      if (sortedYears.length) { yearFilter.value = sortedYears.pop(); currentYear = yearFilter.value; }

      statusFilter.innerHTML = '<option value="all">All status</option>';
      Array.from(statuses).sort().forEach(s => statusFilter.innerHTML += `<option value="${s}">${s}</option>`);
    }

    function applyFilters() {
      if (!dataReady) return;
      const nQ = nameSearch.toLowerCase(), rQ = rollSearch.toLowerCase(), yQ = currentYear, sQ = currentStatus.toLowerCase();
      filtered = ALL_STUDENTS.filter(s => 
        (!nQ || s.name.toLowerCase().includes(nQ)) &&
        (!rQ || s.roll_no.toLowerCase().includes(rQ)) &&
        (yQ === 'all' || s.year === yQ) &&
        (sQ === 'all' || s.status.toLowerCase() === sQ)
      );
      totalMatching = filtered.length; currentOffset = 0; loadedCount = 0;
      cardGrid.innerHTML = totalMatching === 0 ? '<div class="no-results"><i class="fas fa-inbox"></i> No students found.</div>' : '';
      if (totalMatching > 0) renderNextPage();
      updateCounts();
    }

    function renderNextPage() {
      const end = Math.min(currentOffset + PAGE_SIZE, totalMatching);
      if (currentOffset >= end) return;
      document.getElementById('loadMoreWrapper')?.remove();
      
      let html = '';
      for (let i = currentOffset; i < end; i++) {
        const s = filtered[i];
        const statusClass = s.status.toLowerCase() === 'fail' ? 'status-fail' : (s.status.toLowerCase() === 'pass' ? 'status-pass' : '');
        const pdf = s.url_results_pdf ? `<a href="${s.url_results_pdf}" target="_blank" class="pdf-link"><i class="fas fa-file-pdf"></i> PDF</a>` : `<span class="pdf-link disabled"><i class="fas fa-file-pdf"></i> No PDF</span>`;
        
        html += `
          <div class="student-card">
            <div class="card-header"><span class="sr-badge"><i class="fas fa-hashtag"></i> ${s.sr_no}</span><span class="status-badge ${statusClass}">${s.status || '—'}</span></div>
            <div class="student-name"><i class="fas fa-user-circle"></i> ${s.name || '—'}</div>
            <div class="info-row"><div class="info-item"><i class="fas fa-id-card"></i> <strong>Roll</strong> ${s.roll_no || '—'}</div><div class="info-item"><i class="fas fa-calendar"></i> <strong>Year</strong> ${s.year || '—'}</div></div>
            <div class="card-footer"><div class="updated"><i class="far fa-clock"></i> ${s.updated_on}</div>${pdf}</div>
          </div>`;
      }
      cardGrid.insertAdjacentHTML('beforeend', html);
      currentOffset = end; loadedCount = currentOffset; hasMore = currentOffset < totalMatching;
      
      if (hasMore) {
        const wrap = document.createElement('div'); wrap.id = 'loadMoreWrapper'; wrap.className = 'load-more-wrap';
        wrap.innerHTML = `<button class="load-more-btn" onclick="renderNextPage()"><i class="fas fa-arrow-down"></i> Load more</button>`;
        cardGrid.appendChild(wrap);
      }
      updateCounts();
    }

    function updateCounts() {
      shownCount.textContent = loadedCount.toLocaleString();
      totalCount.textContent = totalMatching.toLocaleString();
    }

    nameInput.addEventListener('input', e => { nameSearch = e.target.value; setTimeout(applyFilters, 250); });
    rollInput.addEventListener('input', e => { rollSearch = e.target.value; setTimeout(applyFilters, 250); });
    yearFilter.addEventListener('change', e => { currentYear = e.target.value; applyFilters(); });
    statusFilter.addEventListener('change', e => { currentStatus = e.target.value; applyFilters(); });
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      nameInput.value = ''; rollInput.value = ''; nameSearch = ''; rollSearch = '';
      currentStatus = 'all'; statusFilter.value = 'all';
      const opt = Array.from(yearFilter.options).filter(o => o.value !== 'all');
      currentYear = opt.length ? opt[opt.length-1].value : 'all'; yearFilter.value = currentYear;
      applyFilters();
    });
  </script>

      { srno: 50, subject: "Pakistan Affairs", group_no: "Compulsory", category: "Compulsory", marks: 100, type: "Compulsory", recommended: "All candidates" },
      { srno: 51, subject: "Islamic Studies / Comparative Religion", group_no: "Compulsory", category: "Compulsory", marks: 100, type: "Compulsory", recommended: "All candidates (non-Muslims take Comparative Religion)" }
    ];

    const OPTIONAL_TARGET = 600, TOTAL_TARGET = 1200;
    let GROUPS = [], COMPULSORY = [];
    const GROUP_MAP = {}; 
    const state = {}; 
    let showCompulsory = false, isDataLoaded = false;

    const bGroupsEl = document.getElementById("bGroups");
    const totalPill = document.getElementById("totalPill");
    const stripLabel = document.getElementById("stripLabel");
    const statusEl = document.getElementById("status");
    const chosenListEl = document.getElementById("chosenList");
    const selectedStrip = document.getElementById("selectedStrip");
    const finalOverlay = document.getElementById("finalOverlay");
    const finalList = document.getElementById("finalList");
    const finalTotal = document.getElementById("finalTotal");
    const finalCount = document.getElementById("finalCount");
    const finalStatus = document.getElementById("finalStatus");
    const finalConfirmBtn = document.getElementById("finalConfirmBtn");
    const copyBtn = document.getElementById("copyBtn");

    function initBuilder() {
      SUBJECTS_DATA.forEach(row => {
        const gNum = row.group_no;
        const isComp = (row.type || '').toLowerCase() === 'compulsory';
        
        const subjectObj = { 
          name: row.subject, 
          marks: parseInt(row.marks, 10) || 100, 
          recommended: row.recommended || "Any background" 
        };
        
        if (isComp) { 
          COMPULSORY.push(subjectObj); 
          return; 
        }
        
        if (!GROUP_MAP[gNum]) {
          GROUP_MAP[gNum] = { 
            groupNumber: gNum, 
            name: row.category, 
            rule: getRuleForGroup(gNum), 
            maxSubjects: gNum === "II" ? 2 : 1, 
            maxMarks: gNum === "I" || gNum === "II" ? 200 : 100, 
            subjects: [] 
          };
        }
        GROUP_MAP[gNum].subjects.push(subjectObj);
      });

      GROUPS = Object.values(GROUP_MAP).sort((a, b) => a.groupNumber.localeCompare(b.groupNumber));
      GROUPS.forEach(g => state[g.groupNumber] = []);
      
      isDataLoaded = true;
      renderBGroups();
      updateBUI();
      
      const g1 = document.querySelector('.b-group[data-group="I"]');
      if (g1) g1.classList.add("open");
    }

    function getRuleForGroup(g) {
      if (g === "I") return "Select ONE (200 marks).";
      if (g === "II") return "ONE 200-mark OR up to TWO 100-mark (max 200).";
      return "Select ONE (100 marks).";
    }

    const subj = (g, n) => GROUPS.find(x => x.groupNumber === g).subjects.find(s => s.name === n);
    const groupMarks = g => state[g].reduce((s, n) => s + subj(g, n).marks, 0);
    const optionalMarks = () => GROUPS.reduce((s, g) => s + groupMarks(g.groupNumber), 0);
    const compulsoryMarks = () => COMPULSORY.reduce((s, c) => s + c.marks, 0);
    const totalMarks = () => optionalMarks() + compulsoryMarks();
    const totalCount = () => GROUPS.reduce((s, g) => s + state[g.groupNumber].length, 0) + COMPULSORY.length;

    function getViolations() {
      const v = [];
      GROUPS.forEach(g => {
        const sel = state[g.groupNumber]; if (!sel.length) return;
        const m = groupMarks(g.groupNumber);
        if (sel.length > g.maxSubjects) v.push({group: g.groupNumber, type: "count", message: `Group ${g.groupNumber}: ${sel.length} picked.`});
        if (m > g.maxMarks) v.push({group: g.groupNumber, type: "marks", message: `Group ${g.groupNumber}: cap exceeded.`});
        if (g.groupNumber === "II" && sel.length > 1 && sel.some(n => subj("II", n).marks === 200)) v.push({group: "II", type: "mix", message: `Group II: invalid combination.`});
      });
      const optTotal = optionalMarks();
      if (optTotal !== OPTIONAL_TARGET) v.push({group: null, type: "total", message: optTotal > OPTIONAL_TARGET ? `Over by ${optTotal-OPTIONAL_TARGET} marks.` : `Need ${OPTIONAL_TARGET-optTotal} more marks.`});
      return v;
    }

    function violatingKeys() {
      const keys = new Set();
      GROUPS.forEach(g => {
        const sel = state[g.groupNumber]; if (!sel.length) return;
        if (sel.length > g.maxSubjects || groupMarks(g.groupNumber) > g.maxMarks || (g.groupNumber === "II" && sel.length > 1 && sel.some(n => subj("II", n).marks === 200))) {
          sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
        }
      });
      return keys;
    }

    function buildChips(ulEl, flagged, onRemove) {
      ulEl.innerHTML = "";
      let any = false;
      COMPULSORY.forEach(c => {
        any = true;
        const li = document.createElement("li");
        li.className = "comp";
        li.innerHTML = `<span>Comp: ${c.name} (${c.marks})</span><span style="color:var(--muted); font-size:0.75rem;">Fixed</span>`;
        ulEl.appendChild(li);
      });
      GROUPS.forEach(g => {
        state[g.groupNumber].forEach(n => {
          any = true;
          const s = subj(g.groupNumber, n);
          const li = document.createElement("li");
          li.className = `g${g.groupNumber === 'I' ? 1 : g.groupNumber === 'II' ? 2 : g.groupNumber === 'III' ? 3 : g.groupNumber === 'IV' ? 4 : g.groupNumber === 'V' ? 5 : g.groupNumber === 'VI' ? 6 : 7}`;
          if (flagged.has(`${g.groupNumber}|${n}`)) li.classList.add("violating");
          li.innerHTML = `<span>G${g.groupNumber}: ${s.name} (${s.marks})</span><button class="rm">×</button>`;
          li.querySelector(".rm").addEventListener("click", (e) => { e.stopPropagation(); onRemove(g.groupNumber, n); });
          ulEl.appendChild(li);
        });
      });
      return any;
    }

    function renderBGroups() {
      bGroupsEl.innerHTML = "";
      
      const compDiv = document.createElement("div");
      compDiv.className = "b-group"; compDiv.id = "compGroup"; compDiv.style.display = showCompulsory ? "block" : "none";
      compDiv.innerHTML = `
        <div class="b-group-header"><span>Compulsory Subjects <small>Fixed (600 marks)</small></span><span class="chev">▶</span></div>
        <div class="b-group-body"><div class="rule">All candidates must take these 6 subjects.</div></div>`;
      compDiv.querySelector(".b-group-header").addEventListener("click", () => compDiv.classList.toggle("open"));
      const compBody = compDiv.querySelector(".b-group-body");
      COMPULSORY.forEach(s => {
        const row = document.createElement("div"); row.className = "b-subject compulsory selected";
        row.innerHTML = `<span>${s.name}</span><span class="marks">${s.marks}</span><div class="b-rec-badge"><strong>Recommended:</strong> ${s.recommended}</div>`;
        compBody.appendChild(row);
      });
      bGroupsEl.appendChild(compDiv);

      GROUPS.forEach(g => {
        const d = document.createElement("div"); d.className = "b-group"; d.dataset.group = g.groupNumber;
        d.innerHTML = `
          <div class="b-group-header"><span>Group ${g.groupNumber} — ${g.name} <small>${g.rule}</small></span><span class="chev">▶</span></div>
          <div class="b-group-body"><div class="rule">${g.rule}</div><div class="rule-flag" data-flag="${g.groupNumber}" style="font-size:0.75rem; color:var(--danger); margin-bottom:6px;"></div></div>`;
        d.querySelector(".b-group-header").addEventListener("click", () => d.classList.toggle("open"));
        const body = d.querySelector(".b-group-body");
        g.subjects.forEach(s => {
          const row = document.createElement("div"); row.className = "b-subject"; row.dataset.group = g.groupNumber; row.dataset.subject = s.name;
          row.innerHTML = `<span>${s.name}</span><span class="marks">${s.marks}</span><div class="b-rec-badge"><strong>Recommended:</strong> ${s.recommended}</div>`;
          row.addEventListener("click", () => toggleB(g.groupNumber, s.name));
          body.appendChild(row);
        });
        bGroupsEl.appendChild(d);
      });
    }

    function toggleB(g, n) {
      const sel = state[g], i = sel.indexOf(n);
      i === -1 ? sel.push(n) : sel.splice(i, 1);
      updateBUI();
    }

    document.getElementById("toggleCompulsory").addEventListener("change", (e) => {
      showCompulsory = e.target.checked;
      document.getElementById("compGroup").style.display = showCompulsory ? "block" : "none";
      if (showCompulsory) document.getElementById("compGroup").classList.add("open");
    });

    function updateBUI() {
      if (!isDataLoaded) return;
      const violations = getViolations(), flagged = violatingKeys();
      const optTotal = optionalMarks(), fullTotal = totalMarks(), isValid = optTotal === OPTIONAL_TARGET;

      stripLabel.textContent = showCompulsory ? "Total · Target 1200" : "Optional · Target 600";
      totalPill.textContent = showCompulsory ? `${fullTotal} / ${TOTAL_TARGET}` : `${optTotal} / ${OPTIONAL_TARGET}`;
      totalPill.className = `b-total-pill ${isValid ? 'ok' : (optTotal > OPTIONAL_TARGET ? 'over' : '')}`;
      selectedStrip.classList.toggle("valid", isValid);

      document.querySelectorAll(".b-subject:not(.compulsory)").forEach(row => {
        const g = row.dataset.group, s = row.dataset.subject;
        const isSel = state[g].includes(s);
        row.classList.toggle("selected", isSel);
        row.classList.toggle("violating", isSel && flagged.has(`${g}|${s}`));
      });

      GROUPS.forEach(g => {
        const gd = document.querySelector(`.b-group[data-group="${g.groupNumber}"]`);
        if (!gd) return;
        const gv = violations.filter(v => v.group === g.groupNumber);
        gd.classList.toggle("violation", gv.length > 0);
        const flagEl = gd.querySelector(`.rule-flag`);
        if (flagEl) flagEl.textContent = gv.length ? "⚠ " + gv.map(v => v.message).join(" ") : "";
      });

      statusEl.className = "b-status";
      const tv = violations.find(v => v.type === "total"), rv = violations.filter(v => v.type !== "total");
      if (isValid) { statusEl.classList.add("ok"); statusEl.textContent = "✅ Valid combination!"; }
      else if (rv.length) { statusEl.classList.add("err"); statusEl.textContent = "❌ FPSC rule violation."; }
      else { statusEl.classList.add("warn"); statusEl.textContent = "⚠ " + (tv ? tv.message : ""); }

      const any = buildChips(chosenListEl, flagged, (g, n) => { state[g] = state[g].filter(x => x !== n); updateBUI(); });
      if (!any) chosenListEl.innerHTML = `<li class="empty">No subjects selected yet.</li>`;
      if (finalOverlay.classList.contains("active")) renderFinal();
    }

    function renderFinal() {
      const violations = getViolations(), flagged = violatingKeys();
      const optTotal = optionalMarks(), fullTotal = totalMarks(), count = totalCount(), isValid = optTotal === OPTIONAL_TARGET;

      finalTotal.textContent = `${fullTotal} / ${TOTAL_TARGET}`;
      finalCount.textContent = `${count}`;
      
      const any = buildChips(finalList, flagged, (g, n) => { state[g] = state[g].filter(x => x !== n); updateBUI(); renderFinal(); });
      if (!any) finalList.innerHTML = `<li class="empty">No subjects selected yet.</li>`;

      const tv = violations.find(v => v.type === "total"), rv = violations.filter(v => v.type !== "total");
      if (isValid) { finalStatus.className = "b-status ok"; finalStatus.textContent = "✅ 600 optional + 600 compulsory = 1200 marks! Ready."; }
      else if (rv.length) { finalStatus.className = "b-status err"; finalStatus.textContent = "❌ FPSC rule violation — remove red items."; }
      else { finalStatus.className = "b-status warn"; finalStatus.textContent = "⚠ " + (tv ? tv.message : ""); }

      finalConfirmBtn.disabled = !isValid;
      copyBtn.disabled = totalCount() === 0;
    }

    copyBtn.addEventListener("click", async () => {
      let lines = ["CSS Final Choice\n====================", "\n[ Compulsory ]"];
      COMPULSORY.forEach(c => lines.push(`- ${c.name} (${c.marks})`));
      lines.push("\n[ Optional ]");
      GROUPS.forEach(g => state[g.groupNumber].forEach(n => lines.push(`- G${g.groupNumber}: ${subj(g.groupNumber, n).name} (${subj(g.groupNumber, n).marks})`)));
      lines.push(`\nTotal: ${totalMarks()} / 1200`);
      
      try { 
        await navigator.clipboard.writeText(lines.join("\n")); 
        copyBtn.textContent = "✓ Copied!";
        setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy List', 1500);
      } catch(e) { alert(lines.join("\n")); }
    });

    selectedStrip.addEventListener("click", () => {
      renderFinal(); finalOverlay.classList.add("active");
    });
    document.getElementById("finalCloseBtn").addEventListener("click", () => finalOverlay.classList.remove("active"));
    finalConfirmBtn.addEventListener("click", () => {
      if (optionalMarks() !== OPTIONAL_TARGET) return;
      finalOverlay.classList.remove("active");
      selectedStrip.style.boxShadow = "0 0 0 3px rgba(34,197,94,0.5)";
      setTimeout(() => selectedStrip.style.boxShadow = "", 600);
    });

    document.getElementById("expandAllBtn").addEventListener("click", () => document.querySelectorAll(".b-group").forEach(g => g.classList.add("open")));
    document.getElementById("collapseAllBtn").addEventListener("click", () => document.querySelectorAll(".b-group").forEach(g => g.classList.remove("open")));
    document.getElementById("resetBtn").addEventListener("click", () => { GROUPS.forEach(g => state[g.groupNumber] = []); updateBUI(); });

    // Initialize the builder
    initBuilder();
  </script>
</body>
</html>
