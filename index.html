<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CSS Portal — Results & Subject Builder</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 14 L52 22 L32 30 L12 22 Z' fill='%23ffffff'/%3E%3Cpath d='M20 26 L20 38 C20 42 26 46 32 46 C38 46 44 42 44 38 L44 26' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ============================================================
       SHARED THEME TOKENS
       ============================================================ */
    :root, [data-theme="light"] {
      --bg: #f4f7fc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --accent: #2563eb;
      --accent-hover: #1a4fc7;
      --ok: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
      --text: #1e2b3c;
      --text-dark: #0a1e2e;
      --muted: #64748b;
      --border: #e2e9f3;
      --shadow: rgba(0, 20, 40, 0.06);
      --hover: #f8fafc;
      --grey: #94a3b8;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --ok: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --text: #e2e8f0;
      --text-dark: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: rgba(0, 0, 0, 0.3);
      --hover: #2e3d56;
      --grey: #64748b;
    }

    /* ============================================================
       GLOBAL RESET & APP HEADER
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    .app-header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center;
      flex: 0 0 auto; z-index: 50; box-shadow: 0 4px 12px var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.1rem; color: var(--text-dark); }
    .brand i { color: var(--accent); font-size: 1.4rem; }
    .brand .version { font-size: 0.6rem; color: var(--muted); background: var(--panel-2); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border); }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .nav-tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
    .nav-tab {
      padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.8rem; font-weight: 600; color: var(--muted);
      cursor: pointer; border: none; background: transparent; display: flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .nav-tab.active { background: var(--panel); color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }
    
    .theme-btn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 50%;
      width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; transition: 0.2s;
    }
    .theme-btn:hover { background: var(--hover); }

    /* ============================================================
       VIEWS
       ============================================================ */
    .view-section { display: none; flex: 1; min-height: 0; overflow-y: auto; }
    .view-section.active { display: flex; flex-direction: column; }

    /* ============================================================
       1. RESULTS DASHBOARD
       ============================================================ */
    .results-wrapper { padding: 1.5rem; max-width: 1440px; margin: 0 auto; width: 100%; }
    .dash-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .dash-header h1 { font-weight: 600; font-size: 1.5rem; color: var(--text-dark); display: flex; align-items: center; gap: 10px; }
    .badge-count { background: var(--panel-2); color: var(--text); padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); }
    .load-status { background: var(--panel); padding: 0.5rem 1rem; border-radius: 40px; font-size: 0.85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
    .load-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
    .load-status.done .dot { background: var(--ok); animation: none; }
    .load-status.error .dot { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; background: var(--panel); padding: 1rem 1.5rem; border-radius: 20px; box-shadow: 0 8px 20px var(--shadow); align-items: center; border: 1px solid var(--border); }
    .search-group { display: flex; flex-wrap: wrap; gap: 0.8rem; flex: 2; min-width: 260px; }
    .search-wrapper { flex: 1; min-width: 180px; position: relative; }
    .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-wrapper input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 60px; background: var(--bg); color: var(--text); outline: none; transition: 0.2s; }
    .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
    
    .filter-group { display: flex; flex-wrap: wrap; gap: 1rem; flex: 3; justify-content: flex-end; }
    .select-wrapper { position: relative; min-width: 140px; }
    .select-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 0.9rem; }
    .select-wrapper select { width: 100%; padding: 0.8rem 2rem 0.8rem 2.5rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; appearance: none; background: var(--bg); border: 1px solid var(--border); border-radius: 60px; cursor: pointer; outline: none; color: var(--text); font-weight: 500; }
    .select-wrapper::after { content: '\f107'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    
    .clear-btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 60px; padding: 0.8rem 1.5rem; font-weight: 500; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .clear-btn:hover { background: var(--hover); }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    .student-card { background: var(--panel); border-radius: 20px; padding: 1.5rem; box-shadow: 0 12px 30px var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.9rem; transition: 0.2s; }
    .student-card:hover { transform: translateY(-4px); box-shadow: 0 20px 35px var(--shadow); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .sr-badge { background: var(--panel-2); color: var(--accent); font-weight: 600; font-size: 0.8rem; padding: 0.3rem 0.9rem; border-radius: 40px; display: flex; align-items: center; gap: 5px; }
    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 1rem; border-radius: 40px; text-transform: uppercase; background: var(--panel-2); color: var(--muted); }
    .status-badge.status-fail { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
    .status-badge.status-pass { background: rgba(22, 163, 74, 0.1); color: var(--ok); }
    
    .student-name { font-weight: 700; font-size: 1.2rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
    .student-name i { color: var(--accent); opacity: 0.8; }
    .info-row { display: flex; flex-wrap: wrap; gap: 1rem; background: var(--bg); padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid var(--border); }
    .info-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .info-item i { color: var(--muted); }
    .info-item strong { color: var(--text-dark); margin-right: 4px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 0.8rem; }
    .updated { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .pdf-link { background: var(--accent); color: #fff; text-decoration: none; padding: 0.4rem 1rem; border-radius: 60px; font-weight: 500; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 7px; }
    .pdf-link:hover { background: var(--accent-hover); }
    .pdf-link.disabled { background: var(--panel-2); color: var(--muted); pointer-events: none; }

    .no-results, .loading-spinner, .error-message { grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--panel); border-radius: 20px; border: 1px dashed var(--border); }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .load-more-wrap { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 2rem 1rem; }
    .load-more-btn { background: var(--accent); color: white; border: none; border-radius: 60px; padding: 0.9rem 2.2rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(37,99,235,0.25); }
    .load-more-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

    /* ============================================================
       2. SUBJECT BUILDER (Compact GUI)
       ============================================================ */
    .builder-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 760px; width: 100%; margin: 0 auto; padding: 0; }
    
    .b-header { padding: 6px 10px 4px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .title-left { display: flex; align-items: center; gap: 6px; }
    .title-left h2 { font-size: 0.9rem; margin: 0; font-weight: 700; }
    
    .header-right { display: flex; align-items: center; gap: 6px; }
    
    /* Toggle Switch */
    .toggle-label { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: var(--muted); cursor: pointer; background: var(--panel-2); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
    .toggle-label input { display: none; }
    .toggle-switch { width: 26px; height: 14px; background: var(--border); border-radius: 999px; position: relative; transition: 0.2s; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle-label input:checked + .toggle-switch { background: var(--ok); }
    .toggle-label input:checked + .toggle-switch::after { transform: translateX(12px); }

    /* Selected strip */
    .selected-strip { margin-top: 2px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-height: 18vh; overflow-y: auto; flex: 0 0 auto; transition: border-color 0.2s; cursor: pointer; position: relative; }
    .selected-strip.valid { border-color: var(--ok); }
    .strip-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .strip-head .lbl { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .total-pill { font-size: 0.85rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--text); transition: background 0.2s, color 0.2s; }
    .total-pill.ok { background: rgba(34,197,94,0.2); color: var(--ok); }
    .total-pill.over { background: rgba(239,68,68,0.2); color: var(--danger); }
    .total-pill.valid-grey { background: var(--panel-2); color: var(--grey); }
    .expand-hint { font-size: 0.65rem; color: var(--accent); margin-top: 2px; display: flex; align-items: center; gap: 4px; }

    /* Shared row-chip list */
    .chosen-list { list-style: none; padding: 0; margin: 0; }
    .chosen-list li { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; background: var(--panel-2); margin-bottom: 3px; font-size: 0.85rem; border-left: 3px solid transparent; }
    .chosen-list li.violating { background: rgba(239,68,68,0.12); }
    .chosen-list li.g1 { border-left-color: #3b82f6; } .chosen-list li.g2 { border-left-color: #22c55e; }
    .chosen-list li.g3 { border-left-color: #a855f7; } .chosen-list li.g4 { border-left-color: #f59e0b; }
    .chosen-list li.g5 { border-left-color: #ec4899; } .chosen-list li.g6 { border-left-color: #06b6d4; }
    .chosen-list li.g7 { border-left-color: #f97316; } .chosen-list li.comp { border-left-color: #94a3b8; }
    .chosen-list li.violating.g1, .chosen-list li.violating.g2, .chosen-list li.violating.g3, .chosen-list li.violating.g4, .chosen-list li.violating.g5, .chosen-list li.violating.g6, .chosen-list li.violating.g7 { border-left-color: var(--danger); }
    .chip-left { display: flex; align-items: center; gap: 6px; }
    .group-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
    .g1 .group-dot { background: #3b82f6; } .g2 .group-dot { background: #22c55e; } .g3 .group-dot { background: #a855f7; }
    .g4 .group-dot { background: #f59e0b; } .g5 .group-dot { background: #ec4899; } .g6 .group-dot { background: #06b6d4; } .g7 .group-dot { background: #f97316; }
    .comp-dot { background: #94a3b8; }
    .chosen-list.valid li { border-left-color: var(--grey) !important; background: var(--panel-2); }
    .chosen-list.valid .group-dot { background: var(--grey) !important; }
    .chosen-list .rm { color: var(--danger); background: none; border: none; font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 0 2px; }
    .chosen-list.valid .rm { color: var(--grey); }
    .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; padding: 2px 4px; }

    .status { font-size: 0.8rem; margin-top: 4px; min-height: 16px; }
    .status.ok { color: var(--ok); } .status.err { color: var(--danger); } .status.warn { color: var(--warn); }
    .hint { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4); color: var(--danger); margin-top: 4px; display: none; }
    .hint.show { display: block; }

    /* Toolbar & Groups */
    .b-toolbar { display: flex; gap: 6px; padding: 6px 10px; flex: 0 0 auto; }
    .b-toolbar button { flex: 1; padding: 6px 8px; border-radius: 6px; cursor: pointer; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-size: 0.8rem; }
    
    #bGroups { flex: 1 1 auto; overflow-y: auto; padding: 0 10px 0; -webkit-overflow-scrolling: touch; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); scroll-padding-bottom: 80px; }
    .group { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; overflow: hidden; scroll-margin-bottom: 60px; }
    .group.violation { border-color: var(--danger); }
    .group-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; cursor: pointer; user-select: none; background: var(--panel-2); font-size: 0.85rem; }
    .group-title { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .group-title small { color: var(--muted); font-weight: 400; margin-left: 2px; font-size: 0.72rem; }
    .group-badge { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .group[data-group="I"] .group-badge { background: #3b82f6; } .group[data-group="II"] .group-badge { background: #22c55e; }
    .group[data-group="III"] .group-badge { background: #a855f7; } .group[data-group="IV"] .group-badge { background: #f59e0b; }
    .group[data-group="V"] .group-badge { background: #ec4899; } .group[data-group="VI"] .group-badge { background: #06b6d4; }
    .group[data-group="VII"] .group-badge { background: #f97316; } .group[data-group="Comp"] .group-badge { background: #94a3b8; }
    .chev { transition: transform 0.2s; color: var(--muted); font-size: 0.75rem; }
    .group.open .chev { transform: rotate(90deg); }
    .group-body { display: none; padding: 6px; }
    .group.open .group-body { display: block; }
    .rule { font-size: 0.72rem; color: var(--accent); padding: 0 6px 4px; }
    .rule-flag { font-size: 0.72rem; color: var(--danger); padding: 0 6px 4px; font-weight: 600; }

    /* Subject Row */
    .subject { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 3px; font-size: 0.85rem; transition: background 0.2s; }
    .subject:hover { background: var(--hover); border-color: var(--border); }
    .subject:hover .rec-badge { display: block; }
    .subject.selected { background: rgba(56,189,248,0.15); border-color: var(--accent); }
    .subject.selected.violating { background: rgba(239,68,68,0.15); border-color: var(--danger); }
    .subject.compulsory { cursor: default; }
    .subject.compulsory.selected { background: rgba(148, 163, 184, 0.15); border-color: #94a3b8; }
    .marks { font-size: 0.75rem; color: var(--muted); }
    .subject.selected .marks { color: var(--accent); }
    .subject.selected.violating .marks { color: var(--danger); }
    .subject.compulsory.selected .marks { color: #94a3b8; }
    
    .rec-badge { display: none; position: absolute; top: 100%; left: 6px; right: 6px; margin-top: 2px; padding: 6px 8px; background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 0.75rem; color: var(--text); z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.3); pointer-events: none; }
    .rec-badge strong { color: var(--accent); }

    /* Full screen overlay */
    .final-overlay { position: fixed; inset: 0; z-index: 100; background: var(--bg); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .final-overlay.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .final-inner { min-height: 100%; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto; width: 100%; }
    .final-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex: 0 0 auto; }
    .final-head h2 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    .final-close { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
    .final-summary { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .final-summary.valid { border-color: var(--ok); }
    .sum-block { display: flex; flex-direction: column; gap: 2px; }
    .sum-block.right { align-items: flex-end; }
    .sum-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .sum-total { font-size: 1.3rem; font-weight: 700; }
    .sum-count { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .final-summary.valid .sum-total { color: var(--ok); }
    .final-summary.valid .sum-count { color: var(--ok); }
    .final-summary.over .sum-total { color: var(--danger); }
    .final-overlay .chosen-list { flex: 0 0 auto; margin-bottom: 8px; }
    .final-overlay .chosen-list li { padding: 10px 12px; font-size: 0.9rem; margin-bottom: 6px; border-radius: 8px; border-left-width: 4px; }
    .final-overlay .chosen-list .rm { font-size: 1.2rem; }
    .final-status { font-size: 0.8rem; margin-top: 4px; text-align: center; flex: 0 0 auto; min-height: 16px; }
    .final-status.ok { color: var(--ok); } .final-status.err { color: var(--danger); } .final-status.warn { color: var(--warn); }
    .final-foot { flex: 0 0 auto; margin-top: auto; padding-top: 10px; display: flex; gap: 8px; }
    .final-foot button { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
    .final-foot .confirm { background: var(--ok); color: #fff; border-color: var(--ok); }
    .final-foot .confirm:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--border); cursor: not-allowed; opacity: 0.7; }
    .copy-row { display: flex; gap: 8px; margin-top: 8px; flex: 0 0 auto; }
    .copy-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: 1px solid var(--accent); background: rgba(56,189,248,0.12); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 4px; }
    .copy-btn:active { background: rgba(56,189,248,0.25); }

      .search-group, .filter-group { width: 100%; }
      .card-grid { grid-template-columns: 1fr; }
      .results-wrapper { padding: 1rem; }

  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;

      const savedTheme = localStorage.getItem('css-theme') || 'light';

        root.setAttribute('data-theme', newTheme);

        localStorage.setItem('css-theme', newTheme);
      });

      document.querySelectorAll('.nav-tab').forEach(tab => {

  <!-- ============================================================
       JAVASCRIPT: RESULTS DASHBOARD (IIFE)
       ============================================================ -->
  <script>
    (() => {
      const CSV_FILE = 'css mpt results - all.csv';
      const CSV_URL  = encodeURI(CSV_FILE);
      const PAGE_SIZE = 1000;
      let ALL_STUDENTS = [], filtered = [], currentOffset = 0, nameSearch = '', rollSearch = '', currentYear = 'all', currentStatus = 'all', totalMatching = 0, loadedCount = 0, hasMore = true, dataReady = false;

      const nameInput = document.getElementById('nameSearch');
      const rollInput = document.getElementById('rollSearch');
      const yearFilter = document.getElementById('yearFilter');
      const statusFilter = document.getElementById('statusFilter');
      const cardGrid = document.getElementById('cardGrid');
      const shownCount = document.getElementById('shownCount');
      const totalCountEl = document.getElementById('totalCount');
      const loadStatusText = document.getElementById('loadStatusText');
      const loadStatus = document.getElementById('loadStatus');

      window.addEventListener('load', () => { loadCSV(); });

      async function loadCSV() {
        loadStatusText.textContent = 'Downloading...';
        try {
          const res = await fetch(CSV_URL);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          loadStatusText.textContent = 'Parsing...';
          ALL_STUDENTS = parseCSV(text);
          loadStatus.classList.add('done');
          loadStatusText.textContent = 'Ready · ' + ALL_STUDENTS.length.toLocaleString();
          dataReady = true;
          loadFilterMeta();
          applyFilters();
        } catch (err) {
          loadStatus.classList.add('error');
          loadStatusText.textContent = 'Failed';
          cardGrid.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Failed to load CSV.</div>';
        }
      }

      function parseCSV(text) {
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const rows = []; let row = [], field = '', inQuotes = false, i = 0;
        while (i < text.length) {
          const ch = text[i], next = text[i + 1] || '';
          if (inQuotes) {
            if (ch === '"') { if (next === '"') { field += '"'; i += 2; continue; } inQuotes = false; i++; continue; }
            field += ch; i++; continue;
          }
          if (ch === '"') { inQuotes = true; i++; continue; }
          if (ch === ',') { row.push(field); field = ''; i++; continue; }
          if (ch === '\r') { i++; continue; }
          if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
          field += ch; i++;
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        if (rows.length < 2) return [];
        const header = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));
        const col = {}; header.forEach((h, idx) => col[h] = idx);
        const get = (arr, ...keys) => { for (const k of keys) if (col[k] !== undefined) return arr[col[k]] || ''; return ''; };
        const out = [];
        for (let r = 1; r < rows.length; r++) {
          const rowArr = rows[r];
          if (!rowArr || rowArr.every(c => String(c).trim() === '')) continue;
          out.push({
            sr_no: get(rowArr, 'sr_no', 'srno', 'sr') || r,
            name: String(get(rowArr, 'name')).trim(),
            roll_no: String(get(rowArr, 'roll_no', 'rollno', 'roll')).trim(),
            status: String(get(rowArr, 'status')).trim(),
            url_results_pdf: String(get(rowArr, 'url_results_pdf', 'url')).trim(),
            year: String(get(rowArr, 'year')).trim(),
            updated_on: String(get(rowArr, 'updated_on', 'updated')).trim() || '—'
          });
        }
        return out;
      }

      function loadFilterMeta() {
        const years = new Set(), statuses = new Set();
        ALL_STUDENTS.forEach(s => { if(s.year) years.add(s.year); if(s.status) statuses.add(s.status); });
        const sortedYears = Array.from(years).sort();
        
        yearFilter.innerHTML = '<option value="all">All years</option>';
        sortedYears.forEach(y => yearFilter.innerHTML += `<option value="${y}">${y}</option>`);
        if (sortedYears.length) { yearFilter.value = sortedYears.pop(); currentYear = yearFilter.value; }

        statusFilter.innerHTML = '<option value="all">All status</option>';
        Array.from(statuses).sort().forEach(s => statusFilter.innerHTML += `<option value="${s}">${s}</option>`);
      }

      function applyFilters() {
        if (!dataReady) return;
        const nQ = nameSearch.toLowerCase(), rQ = rollSearch.toLowerCase(), yQ = currentYear, sQ = currentStatus.toLowerCase();
        filtered = ALL_STUDENTS.filter(s => 
          (!nQ || s.name.toLowerCase().includes(nQ)) &&
          (!rQ || s.roll_no.toLowerCase().includes(rQ)) &&
          (yQ === 'all' || s.year === yQ) &&
          (sQ === 'all' || s.status.toLowerCase() === sQ)
        );
        totalMatching = filtered.length; currentOffset = 0; loadedCount = 0;
        cardGrid.innerHTML = totalMatching === 0 ? '<div class="no-results"><i class="fas fa-inbox"></i> No students found.</div>' : '';
        if (totalMatching > 0) renderNextPage();
        updateCounts();
      }

      function renderNextPage() {
        const end = Math.min(currentOffset + PAGE_SIZE, totalMatching);
        if (currentOffset >= end) return;
        document.getElementById('loadMoreWrapper')?.remove();
        
        let html = '';
        for (let i = currentOffset; i < end; i++) {
          const s = filtered[i];
          const statusClass = s.status.toLowerCase() === 'fail' ? 'status-fail' : (s.status.toLowerCase() === 'pass' ? 'status-pass' : '');
          const pdf = s.url_results_pdf ? `<a href="${s.url_results_pdf}" target="_blank" class="pdf-link"><i class="fas fa-file-pdf"></i> PDF</a>` : `<span class="pdf-link disabled"><i class="fas fa-file-pdf"></i> No PDF</span>`;
          
          html += `
            <div class="student-card">
              <div class="card-header"><span class="sr-badge"><i class="fas fa-hashtag"></i> ${s.sr_no}</span><span class="status-badge ${statusClass}">${s.status || '—'}</span></div>
              <div class="student-name"><i class="fas fa-user-circle"></i> ${s.name || '—'}</div>
              <div class="info-row"><div class="info-item"><i class="fas fa-id-card"></i> <strong>Roll</strong> ${s.roll_no || '—'}</div><div class="info-item"><i class="fas fa-calendar"></i> <strong>Year</strong> ${s.year || '—'}</div></div>
              <div class="card-footer"><div class="updated"><i class="far fa-clock"></i> ${s.updated_on}</div>${pdf}</div>
            </div>`;
        }
        cardGrid.insertAdjacentHTML('beforeend', html);
        currentOffset = end; loadedCount = currentOffset; hasMore = currentOffset < totalMatching;
        
        if (hasMore) {
          const wrap = document.createElement('div'); wrap.id = 'loadMoreWrapper'; wrap.className = 'load-more-wrap';
          wrap.innerHTML = `<button class="load-more-btn" onclick="renderNextPage()"><i class="fas fa-arrow-down"></i> Load more</button>`;
          cardGrid.appendChild(wrap);
        }
        updateCounts();
      }

      function updateCounts() {
        shownCount.textContent = loadedCount.toLocaleString();
        totalCountEl.textContent = totalMatching.toLocaleString();
      }

      nameInput.addEventListener('input', e => { nameSearch = e.target.value; setTimeout(applyFilters, 250); });
      rollInput.addEventListener('input', e => { rollSearch = e.target.value; setTimeout(applyFilters, 250); });
      yearFilter.addEventListener('change', e => { currentYear = e.target.value; applyFilters(); });
      statusFilter.addEventListener('change', e => { currentStatus = e.target.value; applyFilters(); });
      document.getElementById('clearFiltersBtn').addEventListener('click', () => {
        nameInput.value = ''; rollInput.value = ''; nameSearch = ''; rollSearch = '';
        currentStatus = 'all'; statusFilter.value = 'all';
        const opt = Array.from(yearFilter.options).filter(o => o.value !== 'all');
        currentYear = opt.length ? opt[opt.length-1].value : 'all'; yearFilter.value = currentYear;
        applyFilters();
      });
      
      window.renderNextPage = renderNextPage;
    })();
  </script>

  <!-- ============================================================
       JAVASCRIPT: SUBJECT BUILDER (IIFE, READS CSV)
       ============================================================ -->
  <script>
    (() => {
      const CSV_URL = 'css_subjects%20-%20list.csv';
      const OPTIONAL_TARGET = 600;
      const TOTAL_TARGET = 1200;
      const STORAGE_KEY = "css-builder-selection-v4";

      let GROUPS = [];
      let COMPULSORY = [];
      const state = {}; 
      let showCompulsory = false; 
      let isDataLoaded = false;

      const chipClass = { "I":"g1","II":"g2","III":"g3","IV":"g4","V":"g5","VI":"g6","VII":"g7", "Comp":"comp" };
      
      const bGroupsEl      = document.getElementById("bGroups");
      const totalPill     = document.getElementById("totalPill");
      const stripLabel    = document.getElementById("stripLabel");
      const statusEl      = document.getElementById("status");
      const hintBox       = document.getElementById("hintBox");
      const chosenListEl  = document.getElementById("chosenList");
      const selectedStrip = document.getElementById("selectedStrip");
      const finalOverlay    = document.getElementById("finalOverlay");
      const finalList       = document.getElementById("finalList");
      const finalTotal      = document.getElementById("finalTotal");
      const finalCount      = document.getElementById("finalCount");
      const finalSummary    = document.getElementById("finalSummary");
      const finalStatus     = document.getElementById("finalStatus");
      const finalConfirmBtn = document.getElementById("finalConfirmBtn");
      const copyBtn         = document.getElementById("copyBtn");
      const toggleCompulsory= document.getElementById("toggleCompulsory");

      async function loadCSV() {
        try {
          const response = await fetch(`${CSV_URL}?t=${new Date().getTime()}`);
          if (!response.ok) throw new Error("Network response was not ok");
          
          const csvText = await response.text();
          parseCSV(csvText);
          
          isDataLoaded = true;
          renderGroups();
          loadState();
          updateUI();
          
          const g1 = document.querySelector('.group[data-group="I"]');
          if (g1) g1.classList.add("open");
          
        } catch (error) {
          console.error("Error loading CSV:", error);
          bGroupsEl.innerHTML = `<div style="color:var(--danger); padding:20px; text-align:center;">
            <p><strong>Failed to load subjects data.</strong></p>
            <p>Make sure <code>css_subjects - list.csv</code> is in the same folder.</p>
          </div>`;
        }
      }

      function parseCSV(text) {
        const lines = [];
        let currentLine = [];
        let currentCell = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i + 1];

          if (inQuotes) {
            if (char === '"' && nextChar === '"') {
              currentCell += '"'; 
              i++;
            } else if (char === '"') {
              inQuotes = false;
            } else {
              currentCell += char;
            }
          } else {
            if (char === '"') {
              inQuotes = true;
            } else if (char === ',') {
              currentLine.push(currentCell.trim());
              currentCell = '';
            } else if (char === '\n' || char === '\r') {
              if (currentCell !== '' || currentLine.length > 0) {
                currentLine.push(currentCell.trim());
                lines.push(currentLine);
                currentLine = [];
                currentCell = '';
              }
              if (char === '\r' && nextChar === '\n') i++; 
            } else {
              currentCell += char;
            }
          }
        }
        if (currentCell !== '' || currentLine.length > 0) {
          currentLine.push(currentCell.trim());
          lines.push(currentLine);
        }

        if (lines.length < 2) return;

        const headers = lines[0].map(h => h.trim().toLowerCase());
        const dataRows = lines.slice(1);
        const groupMap = {};

        dataRows.forEach(cols => {
          const row = {};
          headers.forEach((h, i) => row[h] = cols[i] || '');

          const gNum = row.group_no;
          const isComp = (row.type || '').toLowerCase() === 'compulsory';

          const subjectName = (row.subject || '').replace(/^"|"$/g, '').trim();
          if (!subjectName) return;

          const subjectObj = {
            name: subjectName,
            marks: parseInt(row.marks, 10) || 100,
            recommended: row.recommended || "Any background"
          };

          if (isComp) {
            COMPULSORY.push(subjectObj);
            return; 
          }

          if (!groupMap[gNum]) {
            groupMap[gNum] = {
              groupNumber: gNum,
              name: row.category,
              rule: getRuleForGroup(gNum),
              maxSubjects: gNum === "II" ? 2 : 1,
              maxMarks: gNum === "I" || gNum === "II" ? 200 : 100,
              subjects: []
            };
          }

          groupMap[gNum].subjects.push(subjectObj);
        });

        GROUPS = Object.values(groupMap).sort((a, b) => a.groupNumber.localeCompare(b.groupNumber));
        GROUPS.forEach(g => state[g.groupNumber] = []);
      }

      function getRuleForGroup(g) {
        switch(g) {
          case "I": return "Select ONE (200 marks).";
          case "II": return "ONE 200-mark OR up to TWO 100-mark (max 200).";
          default: return "Select ONE (100 marks).";
        }
      }

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw || !GROUPS.length) return;
          const parsed = JSON.parse(raw);
          GROUPS.forEach(g => {
            const saved = parsed[g.groupNumber];
            if (Array.isArray(saved)) {
              state[g.groupNumber] = saved.filter(n => g.subjects.some(s => s.name === n));
            }
          });
        } catch(e) {}
      }

      const subj = (g, n) => GROUPS.find(x => x.groupNumber === g).subjects.find(s => s.name === n);
      const groupMarks = g => state[g].reduce((s, n) => s + subj(g, n).marks, 0);
      const optionalMarks = () => GROUPS.reduce((s, g) => s + groupMarks(g.groupNumber), 0);
      const compulsoryMarks = () => COMPULSORY.reduce((s, c) => s + c.marks, 0);
      const totalMarks = () => optionalMarks() + compulsoryMarks();
      const totalSubjectCount = () => GROUPS.reduce((s, g) => s + state[g.groupNumber].length, 0) + COMPULSORY.length;

      function getViolations() {
        const v = [];
        GROUPS.forEach(g => {
          const sel = state[g.groupNumber];
          if (!sel.length) return;
          const m = groupMarks(g.groupNumber);
          if (sel.length > g.maxSubjects)
            v.push({group:g.groupNumber, type:"count", message:`Group ${g.groupNumber}: ${sel.length} picked — allows ${g.maxSubjects}.`});
          if (m > g.maxMarks)
            v.push({group:g.groupNumber, type:"marks", message:`Group ${g.groupNumber}: ${m} marks — cap is ${g.maxMarks}.`});
          if (g.groupNumber === "II" && sel.length > 1 && sel.some(n => subj("II", n).marks === 200))
            v.push({group:"II", type:"mix", message:`Group II: a 200-mark subject can't be combined with another.`});
        });
        
        const optTotal = optionalMarks();
        if (optTotal !== OPTIONAL_TARGET) {
          v.push({group:null, type:"total", message: optTotal > OPTIONAL_TARGET
              ? `Optional total ${optTotal} — over by ${optTotal-OPTIONAL_TARGET}. Remove ${optTotal-OPTIONAL_TARGET} marks.`
              : `Optional total ${optTotal} — need ${OPTIONAL_TARGET-optTotal} more marks.`});
        }
        return v;
      }

      function violatingKeys() {
        const keys = new Set();
        GROUPS.forEach(g => {
          const sel = state[g.groupNumber];
          if (!sel.length) return;
          const m = groupMarks(g.groupNumber);
          const overCount = sel.length > g.maxSubjects;
          const overMarks = m > g.maxMarks;
          const mixII = g.groupNumber === "II" && sel.length > 1 && sel.some(n => subj("II", n).marks === 200);
          if (overCount || overMarks || mixII) sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
        });
        return keys;
      }

      function buildChips(ulEl, flagged, onRemove) {
        ulEl.innerHTML = "";
        let any = false;

        COMPULSORY.forEach(c => {
          any = true;
          const li = document.createElement("li");
          li.className = "comp";
          li.innerHTML = `
            <span class="chip-left">
              <span class="group-dot comp-dot"></span>
              <span>Comp: ${c.name} <span class="marks">(${c.marks})</span></span>
            </span>
            <span style="color:var(--muted); font-size:0.75rem;">Fixed</span>`;
          ulEl.appendChild(li);
        });

        GROUPS.forEach(g => {
          state[g.groupNumber].forEach(n => {
            any = true;
            const s = subj(g.groupNumber, n);
            const li = document.createElement("li");
            li.className = chipClass[g.groupNumber];
            if (flagged.has(`${g.groupNumber}|${n}`)) li.classList.add("violating");
            
            li.innerHTML = `
              <span class="chip-left">
                <span class="group-dot"></span>
                <span>G${g.groupNumber}: ${s.name} <span class="marks">(${s.marks})</span></span>
              </span>
              <button class="rm" title="Remove">×</button>`;
              
            li.querySelector(".rm").addEventListener("click", (e) => {
              e.stopPropagation();
              onRemove(g.groupNumber, n);
            });
            ulEl.appendChild(li);
          });
        });
        return any;
      }

      function renderGroups() {
        bGroupsEl.innerHTML = "";

        const compDiv = document.createElement("div");
        compDiv.className = "group";
        compDiv.dataset.group = "Comp";
        compDiv.id = "compGroup";
        compDiv.style.display = showCompulsory ? "block" : "none";
        
        compDiv.innerHTML = `
          <div class="group-header">
            <span class="group-title">
              <span class="group-badge"></span>
              Compulsory Subjects
              <small>Fixed (600 marks)</small>
            </span>
            <span class="chev">▶</span>
          </div>
          <div class="group-body">
            <div class="rule">All candidates must take these 6 subjects.</div>
          </div>`;
          
        compDiv.querySelector(".group-header").addEventListener("click", () => compDiv.classList.toggle("open"));
        
        const compBody = compDiv.querySelector(".group-body");
        COMPULSORY.forEach(s => {
          const row = document.createElement("div");
          row.className = "subject compulsory selected";
          row.innerHTML = `
            <span>${s.name}</span>
            <span class="marks">${s.marks}</span>
            <div class="rec-badge">
              <strong>Recommended Background:</strong> ${s.recommended}
            </div>
          `;
          compBody.appendChild(row);
        });
        bGroupsEl.appendChild(compDiv);

        GROUPS.forEach(g => {
          const d = document.createElement("div");
          d.className = "group";
          d.dataset.group = g.groupNumber;
          
          d.innerHTML = `
            <div class="group-header">
              <span class="group-title">
                <span class="group-badge"></span>
                Group ${g.groupNumber} — ${g.name}
                <small>${g.rule}</small>
              </span>
              <span class="chev">▶</span>
            </div>
            <div class="group-body">
              <div class="rule">${g.rule}</div>
              <div class="rule-flag" data-flag="${g.groupNumber}"></div>
            </div>`;
            
          d.querySelector(".group-header").addEventListener("click", () => d.classList.toggle("open"));
          
          const body = d.querySelector(".group-body");
          g.subjects.forEach(s => {
            const row = document.createElement("div");
            row.className = "subject";
            row.dataset.group = g.groupNumber;
            row.dataset.subject = s.name;
            
            row.innerHTML = `
              <span>${s.name}</span>
              <span class="marks">${s.marks}</span>
              <div class="rec-badge">
                <strong>Recommended Background:</strong> ${s.recommended}
              </div>
            `;
            
            row.addEventListener("click", () => toggle(g.groupNumber, s.name));
            body.appendChild(row);
          });
          bGroupsEl.appendChild(d);
        });
      }

      function toggle(g, n) {
        const sel = state[g];
        const i = sel.indexOf(n);
        if (i === -1) sel.push(n); else sel.splice(i, 1);
        updateUI();
        saveState();
      }

      toggleCompulsory.addEventListener("change", (e) => {
        showCompulsory = e.target.checked;
        const compGroup = document.getElementById("compGroup");
        if (compGroup) {
          compGroup.style.display = showCompulsory ? "block" : "none";
          if (showCompulsory) compGroup.classList.add("open");
        }
      });

      function updateUI() {
        if (!isDataLoaded) return;

        const violations = getViolations();
        const flagged = violatingKeys();
        const optTotal = optionalMarks();
        const fullTotal = totalMarks();
        const isValid = optTotal === OPTIONAL_TARGET;

        stripLabel.textContent = showCompulsory ? "Total · Target 1200" : "Optional · Target 600";
        totalPill.textContent = showCompulsory ? `${fullTotal} / ${TOTAL_TARGET}` : `${optTotal} / ${OPTIONAL_TARGET}`;

        document.querySelectorAll(".subject:not(.compulsory)").forEach(row => {
          const g = row.dataset.group, s = row.dataset.subject;
          const isSel = state[g].includes(s);
          row.classList.toggle("selected", isSel);
          row.classList.toggle("violating", isSel && flagged.has(`${g}|${s}`));
        });

        GROUPS.forEach(g => {
          const gd = document.querySelector(`.group[data-group="${g.groupNumber}"]`);
          if (!gd) return;
          const flagEl = gd.querySelector(`.rule-flag[data-flag="${g.groupNumber}"]`);
          const gv = violations.filter(v => v.group === g.groupNumber);
          gd.classList.toggle("violation", gv.length > 0);
          flagEl.textContent = gv.length ? "⚠ " + gv.map(v => v.message).join(" ") : "";
        });

        totalPill.className = "total-pill";
        if (isValid) totalPill.classList.add("valid-grey");
        else if (optTotal > OPTIONAL_TARGET) totalPill.classList.add("over");
        else totalPill.classList.add("ok");
        
        selectedStrip.classList.toggle("valid", isValid);

        statusEl.className = "status";
        const tv = violations.find(v => v.type === "total");
        const rv = violations.filter(v => v.type !== "total");
        if (tv && tv.message.includes("over")) {
          statusEl.classList.add("err"); statusEl.textContent = "❌ " + tv.message;
        } else if (rv.length) {
          statusEl.classList.add("err"); statusEl.textContent = "❌ FPSC rule violation — see highlighted groups.";
        } else if (isValid) {
          statusEl.classList.add("ok"); statusEl.textContent = "✅ Valid combination — 600 optional marks!";
        } else {
          statusEl.classList.add("warn"); statusEl.textContent = "⚠ " + tv.message;
        }

        if (violations.length) {
          hintBox.classList.add("show");
          hintBox.innerHTML = "<strong>To fix:</strong><br>• " + violations.map(v => v.message).join("<br>• ");
        } else {
          hintBox.classList.remove("show"); hintBox.innerHTML = "";
        }

        chosenListEl.classList.toggle("valid", isValid);
        const anyHome = buildChips(chosenListEl, flagged, (g, n) => {
          state[g] = state[g].filter(x => x !== n);
          updateUI();
          saveState();
        });
        if (!anyHome) chosenListEl.innerHTML = `<li class="empty">No subjects selected yet.</li>`;

        if (finalOverlay.classList.contains("open")) renderFinal();
      }

      function renderFinal() {
        const violations = getViolations();
        const flagged = violatingKeys();
        const optTotal = optionalMarks();
        const fullTotal = totalMarks();
        const count = totalSubjectCount();
        const isValid = optTotal === OPTIONAL_TARGET;

        finalTotal.textContent = `${fullTotal} / ${TOTAL_TARGET}`;
        finalCount.textContent = `${count}`;
        finalSummary.className = "final-summary";
        if (isValid) finalSummary.classList.add("valid");
        else if (optTotal > OPTIONAL_TARGET) finalSummary.classList.add("over");

        finalList.classList.toggle("valid", isValid);
        const any = buildChips(finalList, flagged, (g, n) => {
          state[g] = state[g].filter(x => x !== n);
          updateUI();
          saveState();
        });
        if (!any) finalList.innerHTML = `<li class="empty">No subjects selected yet. Go back and pick some.</li>`;

        finalStatus.className = "final-status";
        const tv = violations.find(v => v.type === "total");
        const rv = violations.filter(v => v.type !== "total");
        if (isValid) {
          finalStatus.classList.add("ok");
          finalStatus.textContent = "✅ 600 optional + 600 compulsory = 1200 marks! Ready to confirm.";
        } else if (optTotal > OPTIONAL_TARGET) {
          finalStatus.classList.add("err");
          finalStatus.textContent = `❌ Optional over by ${optTotal-OPTIONAL_TARGET} marks — remove subjects to reach 600.`;
        } else if (rv.length) {
          finalStatus.classList.add("err");
          finalStatus.textContent = "❌ FPSC rule violation — remove the red items.";
        } else {
          finalStatus.classList.add("warn");
          finalStatus.textContent = `⚠ Need ${OPTIONAL_TARGET-optTotal} more optional marks to confirm.`;
        }

        finalConfirmBtn.disabled = !isValid;
        copyBtn.disabled = totalSubjectCount() === 0;
        copyBtn.style.opacity = totalSubjectCount() === 0 ? 0.5 : 1;
        copyBtn.style.cursor = totalSubjectCount() === 0 ? "not-allowed" : "pointer";
      }

      function buildCopyText() {
        const lines = [];
        lines.push("CSS Final Choice (Compulsory + Optional)");
        lines.push("========================================");
        
        lines.push("\n[ Compulsory Subjects ]");
        COMPULSORY.forEach(c => lines.push(`- ${c.name} (${c.marks} marks)`));
        lines.push(`Compulsory Total: ${compulsoryMarks()} marks`);

        lines.push("\n[ Optional Subjects ]");
        GROUPS.forEach(g => {
          state[g.groupNumber].forEach(n => {
            const s = subj(g.groupNumber, n);
            lines.push(`- Group ${g.groupNumber}: ${s.name} (${s.marks} marks)`);
          });
        });
        lines.push(`Optional Total: ${optionalMarks()} / 600 marks`);
        
        lines.push("----------------------------------------");
        lines.push(`Grand Total: ${totalMarks()} / 1200 marks`);
        return lines.join("\n");
      }

      copyBtn.addEventListener("click", async () => {
        const text = buildCopyText();
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            ok = true;
          }
        } catch(e) { ok = false; }

        if (!ok) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            ok = true;
          } catch(e) { ok = false; }
        }

        if (ok) {
          const original = copyBtn.textContent;
          copyBtn.classList.add("copied");
          copyBtn.textContent = "✓ Copied!";
          setTimeout(() => {
            copyBtn.classList.remove("copied");
            copyBtn.textContent = original;
          }, 1500);
        } else {
          alert(text);
        }
      });

      function openFinal() {
        renderFinal();
        finalOverlay.classList.add("open");
        finalOverlay.setAttribute("aria-hidden", "false");
        finalOverlay.scrollTop = 0;
      }
      function closeFinal() {
        finalOverlay.classList.remove("open");
        finalOverlay.setAttribute("aria-hidden", "true");
      }

      selectedStrip.addEventListener("click", openFinal);
      document.getElementById("finalCloseBtn").addEventListener("click", closeFinal);
      document.getElementById("finalBackBtn").addEventListener("click", closeFinal);
      finalConfirmBtn.addEventListener("click", () => {
        if (optionalMarks() !== OPTIONAL_TARGET) return;
        closeFinal();
        selectedStrip.style.transition = "box-shadow 0.15s";
        selectedStrip.style.boxShadow = "0 0 0 3px rgba(34,197,94,0.5)";
        setTimeout(() => { selectedStrip.style.boxShadow = ""; }, 600);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && finalOverlay.classList.contains("open")) closeFinal();
      });

      document.getElementById("expandAllBtn").addEventListener("click", () => {
        document.querySelectorAll(".group").forEach(g => g.classList.add("open"));
      });
      document.getElementById("collapseAllBtn").addEventListener("click", () => {
        document.querySelectorAll(".group").forEach(g => g.classList.remove("open"));
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        GROUPS.forEach(g => state[g.groupNumber] = []);
        updateUI();
        saveState();
      });

      // Init Builder
      loadCSV();
    })();
  </script>
</body>
</html>
